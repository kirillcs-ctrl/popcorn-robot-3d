<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D kép – popcornos robot</title><style>*{box-sizing:border-box}body{margin:0;background:#111827;color:white;font:16px system-ui;text-align:center;padding:0;min-height:100vh;display:grid;place-items:center}.scene{width:min(96vw,1080px);aspect-ratio:3/2;position:relative;margin:auto;overflow:hidden;border-radius:14px;perspective:1100px;background:#25324b;box-shadow:0 18px 50px #0008}.layer{position:absolute;pointer-events:none;will-change:transform;transition:transform .08s ease-out}.bg{inset:-5%;width:110%;height:110%;object-fit:cover}.thought{width:57%;left:5%;top:4%;filter:drop-shadow(0 5px 6px #0007)}.robot{height:62%;width:auto;right:10%;bottom:0%;filter:drop-shadow(0 7px 8px #0008)}@media(max-width:600px){.thought{width:60%;top:5%;left:2%}.robot{height:58%;right:4%}}</style></head><body><div class="scene" id="scene"><img class="layer bg" id="bg" src="hatter.jpg"><img class="layer thought" id="thought" src="gondolat.png"><img class="layer robot" id="robot" src="robot.png"></div><script>const s=document.getElementById('scene'),b=document.getElementById('bg'),t=document.getElementById('thought'),r=document.getElementById('robot');function move(e){const q=s.getBoundingClientRect(),x=((e.clientX-q.left)/q.width-.5)*2,y=((e.clientY-q.top)/q.height-.5)*2;b.style.transform=`translate(${-x*9}px,${-y*7}px) scale(1.02)`;t.style.transform=`translate(${x*17}px,${y*13}px)`;r.style.transform=`translate(${x*35}px,${y*22}px)`}s.addEventListener('pointermove',move);s.addEventListener('pointerleave',()=>{for(const a of [b,t,r])a.style.transform='translate(0,0)'})</script></body></html>
